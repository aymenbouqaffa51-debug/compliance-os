[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-os"
version = "3.0.0"
description = "Compliance evidence automation for Moroccan companies selling to Europe. ISO 27001 / SOC 2 readiness with a native Moroccan regulatory layer (Loi 09-08 / CNDP, Loi 05-20, DNSSI)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
compliance = "compliance_os.cli:main"

[tool.setuptools.packages.find]
include = ["compliance_os*"]

[tool.setuptools.package-data]
compliance_os = ["data/frameworks/*.yaml", "data/templates/*"]
