# GitHub organisation checks (read-only, via REST API)
# Each check maps to ISO 27001 Annex A controls and their Moroccan equivalents.
#
# Every check here is answered from a single GET-only collection pass against
# the GitHub API. Nothing is written back to the organisation.

source: github
collector: collect_github

checks:
  - id: GH-01
    title: "Organisation requires two-factor authentication"
    field: org.two_factor_required
    operator: is_true
    severity: critical
    controls: [A.5.17, A.8.5]
    maps_to: [MA05-20-11]
    frameworks: [iso-27001-2022, soc2-tsc]
    rationale: >
      Source code is the highest-value asset for a software company. An
      organisation without enforced 2FA lets one phished password reach every
      private repository.
    remediation: >
      Organisation settings -> Authentication security -> Require two-factor
      authentication for everyone. Members without 2FA are removed from the org
      until they enrol.

  - id: GH-02
    title: "Default branch is protected on all active repositories"
    field: repos.unprotected_default_branches
    operator: len_eq
    value: 0
    severity: high
    controls: [A.8.32, A.8.4]
    maps_to: [MA05-20-05]
    frameworks: [iso-27001-2022, soc2-tsc]
    rationale: >
      Unprotected default branches allow direct pushes that bypass review,
      which defeats the change-management control an auditor tests.
    remediation: >
      For each flagged repository: Settings -> Branches -> Add branch protection
      rule on the default branch. Require at least one approving review and
      disallow force pushes.

  - id: GH-03
    title: "Secret scanning is enabled"
    field: org.secret_scanning_enabled
    operator: is_true
    severity: high
    controls: [A.8.24, A.8.28]
    maps_to: [MA09-08-06]
    frameworks: [iso-27001-2022, soc2-tsc]
    rationale: >
      Committed credentials are the most common root cause of a breach in small
      software teams. Platform-level scanning catches them at push time.
    remediation: >
      Settings -> Code security -> Secret scanning -> Enable for all
      repositories. Pair it with push protection so the commit is blocked.

  - id: GH-04
    title: "Dependabot alerts are enabled"
    field: org.dependabot_alerts_enabled
    operator: is_true
    severity: high
    controls: [A.8.8]
    maps_to: [MA05-20-02]
    frameworks: [iso-27001-2022, soc2-tsc]
    rationale: >
      Vulnerability management requires knowing when a shipped dependency has a
      published advisory. Without alerts the team learns from a customer.
    remediation: >
      Settings -> Code security -> Dependabot alerts -> Enable for all
      repositories, then triage the open alert queue.

  - id: GH-05
    title: "No critical Dependabot alerts left open beyond 30 days"
    field: dependabot.critical_open_over_30d
    operator: len_eq
    value: 0
    severity: critical
    controls: [A.8.8]
    maps_to: [MA05-20-02]
    frameworks: [iso-27001-2022, soc2-tsc]
    rationale: >
      An alert queue nobody burns down is worse than no alerts: it proves the
      process exists on paper only. This is the control auditors sample.
    remediation: >
      Triage every critical alert older than 30 days. Either upgrade the
      dependency or record a documented, time-boxed exception with an owner.

  - id: GH-06
    title: "Outside collaborators are reviewed and minimal"
    field: outside_collaborators.count
    operator: len_lte
    value: 5
    severity: medium
    controls: [A.5.15, A.5.18, A.6.6]
    maps_to: [MA05-20-11, MA09-08-09]
    frameworks: [iso-27001-2022]
    rationale: >
      External accounts with repository access are the classic forgotten
      credential. They must be named, contracted and periodically reviewed.
    remediation: >
      Review People -> Outside collaborators. Remove anyone without a current
      engagement, and ensure a signed confidentiality agreement is on file.

  - id: GH-07
    title: "Organisation members have reviewed access in the last 90 days"
    field: access_review.last_review_days
    operator: lte
    value: 90
    severity: medium
    controls: [A.5.18]
    maps_to: [MA05-20-11]
    frameworks: [iso-27001-2022, soc2-tsc]
    rationale: >
      Access reviews are the evidence that least-privilege is real rather than
      aspirational. Quarterly is the cadence auditors expect.
    remediation: >
      Run an access review: export the member and role list, have the CTO
      confirm each entry, and record the review with a date and approver.

  - id: GH-08
    title: "Signed commits or verified committer emails"
    field: org.commit_signing_required
    operator: is_true
    severity: low
    controls: [A.8.32]
    maps_to: []
    frameworks: [soc2-tsc]
    rationale: >
      Commit provenance supports change-management integrity claims. It is a
      lower priority than branch protection but cheap once that exists.
    remediation: >
      Enable vigilant mode, then require signed commits on the default branch
      protection rule.
