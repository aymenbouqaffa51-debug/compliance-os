# ISO/IEC 27001:2022 — Annex A (sélection opérationnelle)
# Cadre: ISO/IEC 27001:2022, Annexe A (93 mesures)
# Note: cette sélection couvre les thèmes A.5 à A.8 les plus fréquemment
# demandés par les acheteurs européens. Elle n'est pas exhaustive : ajouter les
# contrôles manquants selon le périmètre du client.
#
# Le champ « maps_to » contient les correspondances vers les cadres marocains
# (ids MA09-08-* et MA05-20-*), ce qui permet de produire en une passe un pack
# de preuves utilisable à la fois pour l'ISO 27001 et pour la Loi 09-08.
id: iso-27001-2022
name: ISO/IEC 27001:2022 — Annexe A (sélection opérationnelle)
version: '2022'
locale: en
authority: ISO/IEC
source_url: https://www.iso.org/standard/27001
description: 'Sélection opérationnelle des mesures de l''Annexe A de l''ISO/IEC 27001:2022, structurée
  par thème (organisationnel, personnes, physique, technologique). Conçue pour une PME de 15 à 120 personnes
  préparant une certification.

  '
disclaimer: 'La certification ISO/IEC 27001 est délivrée par un organisme de certification indépendant
  et accrédité, jamais par un consultant. Ce fichier ne reproduit pas le texte normatif sous copyright
  ISO : chaque contrôle est une reformulation opérationnelle destinée à l''évaluation.

  '
